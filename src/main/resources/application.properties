spring.application.name=IS_LAB1
server.port=8080

# Подключение к БД. Значения по умолчанию - для локальной проверки.
# На Helios задаются переменными окружения (см. docs/03_RUN_AND_TEST.md):
#   DB_URL=jdbc:postgresql://pg:5432/studs  DB_USER=sNNNNNN  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}

# Таблицы, последовательности и CHECK-ограничения создаёт schema.sql (ORM DDL не генерирует)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Небольшой пул соединений: на общем сервере pg у каждого студента ограничено число подключений
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}

# --- ЛР2 ---
# JWT. Секрет можно переопределить переменной окружения JWT_SECRET (строка в формате base64url, не короче 32 байт)
security.jwt.secret_key=${JWT_SECRET:4eeab38d706831be4b36612ead768ef8182d1dd6f0e14e5dc934652e297fb16a}
# Время жизни токенов, мс (10 часов / 70 часов)
security.jwt.access_token_expiration=36000000
security.jwt.refresh_token_expiration=252000000

# Размер загружаемого файла импорта
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB